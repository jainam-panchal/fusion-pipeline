[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/stages",
    "crates/regex",
    "crates/nats",
    "crates/state",
    "crates/otel",
    "crates/lua",
    "crates/pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
fusion-core = { path = "crates/core" }
fusion-stages = { path = "crates/stages" }
fusion-regex = { path = "crates/regex" }
fusion-nats = { path = "crates/nats" }
fusion-state = { path = "crates/state" }
fusion-otel = { path = "crates/otel" }
fusion-lua = { path = "crates/lua" }

async-nats = "0.50"
crossbeam-channel = "0.5"
csv = "1"
mimalloc = { version = "0.1", default-features = false }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "logs", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "logs", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "logs", "trace", "http-proto", "reqwest-blocking-client"] }
pcre2-sys = "0.2"
redis = { version = "1.7", default-features = false }
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
