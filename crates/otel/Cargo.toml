[package]
name = "fusion-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fusion-core.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
thiserror.workspace = true

[features]
# `with_queue` on the OTLP event log and trace sink, for tests that need a queue of a known
# size; a deployment sizes the queues through the environment.
test-util = []

[dev-dependencies]
# The crate's own integration tests use `test-util`.
fusion-otel = { path = ".", features = ["test-util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
