source:
  type: nats
  stream: LOGS
  consumer: pipeline
nodes:
  - id: drop_debug
    type: filter
    condition: severity_text == "DEBUG"
    action: drop
  - id: parse
    type: extract
    field: body
    pattern: '^(?<level>[A-Z]+): (?<message>.+)$'
  - id: out
    type: sink.nats
    stream: PROCESSED
    subject: processed.logs
