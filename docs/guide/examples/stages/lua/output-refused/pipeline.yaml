nodes:
  - id: colour
    type: lua
    on_error: pass
    source: |
      function process(record)
        -- Any key and any value is fine, but a Lua function has no JSON form,
        -- so the returned record is refused and `on_error: pass` forwards the
        -- record as it entered the node.
        record.colour = function() return "red" end
        return record
      end
  - id: out
    type: sink.nats
    stream: PROCESSED
    subject: processed.logs
