nodes:
  - id: parse_pairs
    type: lua
    source: |
      function process(record)
        for k, v in string.gmatch(record.body, "(%w+)=(%S+)") do
          -- Only where a value is about to go in: nothing is added otherwise.
          record.attributes = record.attributes or {}
          record.attributes[k] = v
        end
        return record
      end
  - id: out
    type: sink.nats
    stream: PROCESSED
    subject: processed.logs
