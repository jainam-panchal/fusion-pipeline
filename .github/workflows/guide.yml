# Builds the guide under docs/guide and runs the tests that keep it true: every example
# produces its expected output, every stage type has a page, every include resolves.
name: guide

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # mdBook exits 0 when an include is missing, so any ERROR or WARN line fails the step.
      - name: Build the book
        run: |
          mdbook build docs/guide 2>&1 | tee mdbook.log
          if grep -E '(ERROR|WARN)' mdbook.log; then exit 1; fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the examples and pages
        run: cargo test --locked -p fusion-pipeline --test guide_examples --test guide_pages
