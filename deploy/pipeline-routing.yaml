# A routing pipeline over the same compose streams: LOGS in, PROCESSED out on three
# subjects.
#
#   pipelined --config deploy/pipeline-routing.yaml
#
# DEBUG records are dropped and acked. What survives is routed by log format to that
# format's extract node: Linux goes to two sinks (fan-out), Apache and everything else
# share one (fan-in). A record is acked once every branch it took has a PubAck.
#
# `url` here and on each sink is overridden by NATS_URL when set.
workers: 4
source:
  type: nats
  url: nats://127.0.0.1:4222
  stream: LOGS
  consumer: pipeline
nodes:
  - id: drop_debug
    type: filter
    condition: severity_text == "DEBUG"
    action: drop

  - id: by_format
    type: route                             # reads from drop_debug, the previous node
    routes:                                 # ordered; first match wins
      linux: resource.log.format == "Linux"
      apache: resource.log.format == "Apache"
    default: other

  - id: parse_linux
    type: extract                     # named groups become attributes.<name>
    from: by_format.linux
    field: body
    pattern: '^(?<Month>[A-Z][a-z]{2}) +(?<Date>\d{1,2}) (?<Time>\d{2}:\d{2}:\d{2}) (?<Level>\S+) (?<Component>[^\[:]+)(?:\[(?<PID>\d+)\])?: (?<Content>.*)$'

  - id: parse_apache
    type: extract
    from: by_format.apache
    field: body
    pattern: '^\[(?<Time>[^\]]+)\] \[(?<Level>\w+)\] (?<Content>.*)$'

  - id: linux_out
    type: sink.nats
    from: parse_linux
    url: nats://127.0.0.1:4222
    stream: PROCESSED
    subject: processed.linux

  - id: linux_archive
    type: sink.nats
    from: parse_linux                       # fan-out: the same upstream twice
    url: nats://127.0.0.1:4222
    stream: PROCESSED
    subject: processed.archive.linux

  - id: rest_out
    type: sink.nats
    from: [parse_apache, by_format.other]   # fan-in
    url: nats://127.0.0.1:4222
    stream: PROCESSED
    subject: processed.rest
