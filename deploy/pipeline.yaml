# The pipeline the compose stack and the smoke test run: LOGS in, TRACE-level records
# dropped, repeats of a body within 10s dropped, syslog lines parsed into attributes, IPv4
# addresses masked, everything else to PROCESSED; on a second branch, only the records the
# syslog pattern parsed, to processed.parsed.
#
#   pipelined --config deploy/pipeline.yaml
#
# `url` here and on the sink is overridden by NATS_URL when set; the state store comes from
# DRAGONFLY_URL (default redis://127.0.0.1:6379, the compose port). The filter is the one
# stage every record crosses, so stage latency and drops by reason are on the dashboard from
# the first record; a record without `severity_text` is not TRACE and passes. The dedupe
# node gives the state-store panels a producer; its window is measured in ingestion time,
# so a redelivered record is never mistaken for a repeat. `on_state_error: nak` (the default
# is `pass`) because in the chaos test a paused Dragonfly must hold records back, not let
# duplicates through: the redelivery lands after the pause is over. The extract node gives
# the regex panels a producer: a body that is not a syslog line is a non-match and passes
# unchanged. The edit node gives `edit_unapplied_total` a producer: it copies the extracted
# component into `attributes.service`, which is unapplied on a body that was not a syslog line,
# and sets the pipeline name. The redact node masks IPv4 addresses in the body and the
# extracted content. The lua node gives `lua_errors_total` a producer: it derives
# `attributes.http.status_class` from `attributes.http.status` and splits a multi-line body
# into one record per line, and a record whose status is not a number makes it raise, a
# `runtime` error that `on_error: pass` forwards unchanged so the main sink still sees every
# record. The parsed branch fans out from the extract node: its edit node runs
# with `on_unapplied: drop`, so a record the pattern did not parse is dropped there with
# reason `edit_unapplied` (the live producer of that reason) while the main branch still
# delivers it; a parsed record reaches processed.parsed with `Content` renamed `message`.
name: compose
source:
  type: nats
  url: nats://127.0.0.1:4222
  stream: LOGS
  consumer: pipeline
nodes:
  - id: drop_trace
    type: filter
    condition: severity_text == "TRACE"
    action: drop
  - id: dedupe_body
    type: dedupe
    key: [body]
    window: 10s
    on_state_error: nak
  - id: parse_syslog
    type: extract
    field: body
    pattern: '^(?<Month>[A-Z][a-z]{2}) +(?<Date>\d{1,2}) (?<Time>\d{2}:\d{2}:\d{2}) (?<Level>\S+) (?<Component>[^\[:]+)(?:\[(?<PID>\d+)\])?: (?<Content>.*)$'
  - id: tag_service
    type: edit
    on_unapplied: skip
    ops:
      - copy: { from: attributes.Component, to: attributes.service }
      - set:  { field: attributes.pipeline, value: compose }
  - id: mask_ips
    type: redact
    fields: [body, attributes.Content]
    pattern: '\b\d{1,3}(?:\.\d{1,3}){3}\b'
    replace: '[ip]'
  - id: split_lines
    type: lua
    on_error: pass                       # pass (default) | drop | nak
    limits: { instructions: 1000000, memory_kib: 16384, output_kib: 1024 }
    source: |
      local function class_of(status)
        if status == nil then return nil end
        return string.format("%dxx", status // 100)
      end

      function process(record)
        local class = class_of(record.attributes["http.status"])
        if class then record.attributes["http.status_class"] = class end
        if type(record.body) ~= "string" or not record.body:find("\n") then
          return record
        end
        local out = {}
        for line in record.body:gmatch("[^\n]+") do
          out[#out + 1] = {
            id = record.id,
            kind = record.kind,
            body = line,
            severity_text = record.severity_text,
            attributes = record.attributes,
            resource = record.resource,
            scope = record.scope,
          }
        end
        return out
      end
  - id: out
    type: sink.nats
    url: nats://127.0.0.1:4222
    stream: PROCESSED
    subject: processed.logs
  - id: only_parsed
    type: edit
    from: parse_syslog                   # fan-out: the main branch above is untouched
    on_unapplied: drop                   # a body the pattern did not parse leaves here
    ops:
      - rename: { from: attributes.Content, to: attributes.message }
  - id: parsed_out
    type: sink.nats
    from: only_parsed
    url: nats://127.0.0.1:4222
    stream: PROCESSED
    subject: processed.parsed
