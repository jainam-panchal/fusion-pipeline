# Loki for the pipeline's logs (issue #12): one process, filesystem storage, OTLP ingestion at
# /otlp. The collector sends OTLP logs there. `service_name` is the only index label: Loki's
# default list would also index `service.instance.id`, so `otlp_config` replaces it. Every
# other resource attribute, every log attribute (`event`, `record.id` as `record_id`,
# `tenant`, `node`, `reason`, ...) and the trace context (`trace_id`, `span_id`) are
# structured metadata, so neither a replica nor a record id adds a stream. Structured metadata needs schema v13 on tsdb, and is switched on here explicitly so
# an image bump that changes the default does not break ingestion.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
