# The one collector every signal goes through. Metrics in over OTLP, out to Prometheus,
# which scrapes :8889. Names and labels pass through as the pipeline emits them: counters
# already end in `_total` and histograms in `_seconds` with unit `s`, so the exporter's
# suffixing changes nothing. The resource becomes the `job` (service name) and `instance`
# (instance id) labels, so two pipeline instances behind one consumer are two series rather
# than one flapping one.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
