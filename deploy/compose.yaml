# The POC stack: NATS JetStream in and out, the pipeline, and its telemetry. Bring up with:
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# `nats-init` runs once and creates the streams and the pull consumer the pipeline expects;
# the pipeline itself never creates them (spec: the sink stream is pre-created by compose).
# Re-running it is safe: every command is skipped when its object already exists.
#
# State: the pipeline's stateful nodes keep their windows in `dragonfly`, reached through
# `DRAGONFLY_URL`; the pipeline opens one connection per worker at start and fails fast when
# the store is unreachable.
#
# Metrics: the pipeline exports over OTLP to `otel-collector`, which serves them to
# `prometheus` on :8889. `nats-exporter` scrapes the NATS monitoring port (JetStream
# consumer pending, redelivered and ack floor included) and `dragonfly` serves its own
# metrics at :6379/metrics. Each process reports its own CPU and memory: the pipeline as
# OTel `process.*` metrics, NATS through the exporter's `-varz`, Dragonfly on its own
# endpoint. `grafana` provisions the Prometheus datasource and the internal dashboard from
# `deploy/grafana`; open http://127.0.0.1:3000/d/fusion-internal.
#
# `deploy/metrics-check.sh` drives traffic through the stack and checks every metric the spec
# names is in Prometheus with its labels.
#
# Host ports that commonly clash with other stacks can be moved: `GRAFANA_PORT` (3000) and
# `DRAGONFLY_PORT` (6379), e.g. `GRAFANA_PORT=3001 docker compose -f deploy/compose.yaml up`.
# Dragonfly's size is `DRAGONFLY_THREADS` (2) and `DRAGONFLY_MAXMEMORY` (512mb).

services:
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats-init:
    image: natsio/nats-box:0.16.0
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export NATS_URL=nats://nats:4222
        nats stream info LOGS >/dev/null 2>&1 \
          || nats stream add LOGS --subjects 'logs.>' --storage file --retention limits \
               --defaults
        nats stream info PROCESSED >/dev/null 2>&1 \
          || nats stream add PROCESSED --subjects 'processed.>' --storage file \
               --retention limits --defaults
        nats consumer info LOGS pipeline >/dev/null 2>&1 \
          || nats consumer add LOGS pipeline --pull --ack explicit --wait 30s \
               --max-deliver 5 --deliver all --replay instant --defaults
        nats stream ls
        nats consumer info LOGS pipeline

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    # State for the pipeline's stateful nodes (dedupe windows). Memory is bounded and
    # eviction stays off: an evicted key would silently reopen a dedupe window, whereas
    # out-of-memory is an error the node's `on_state_error` policy handles visibly.
    # Dragonfly wants 256 MiB per I/O thread; the defaults fit a laptop. Raise both together
    # on a bigger host: `DRAGONFLY_THREADS=8 DRAGONFLY_MAXMEMORY=2gb`.
    command: ["dragonfly", "--logtostderr", "--proactor_threads=${DRAGONFLY_THREADS:-2}", "--maxmemory=${DRAGONFLY_MAXMEMORY:-512mb}", "--cache_mode=false"]
    ports:
      - "${DRAGONFLY_PORT:-6379}:6379"
    healthcheck:
      # The image ships no wget or curl; the port answering is the readiness signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "6379"]
      interval: 2s
      timeout: 2s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter: the pipeline's metrics

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command: ["-varz", "-connz", "-jsz=all", "http://nats:8222"]
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "7777:7777"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=1d"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # POC only: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  pipeline:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fusion-pipeline:local
    depends_on:
      nats-init:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      DRAGONFLY_URL: redis://dragonfly:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    volumes:
      - ./pipeline.yaml:/etc/pipeline/pipeline.yaml:ro
    # First Ctrl-C drains, a second exits at once; give the drain time before the kill.
    stop_signal: SIGINT
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  nats-data:
  prometheus-data:
